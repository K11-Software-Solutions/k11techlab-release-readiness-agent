openapi: 3.0.3
info:
  title: Demo Shop
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /customers:
    post:
      operationId: createCustomer
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 2, maxLength: 50 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { description: Invalid input }
        '401': { description: Unauthorized }
        '409': { description: Email already registered }
  /orders:
    get:
      operationId: listOrders
      summary: List a customer's order history
      parameters:
        - name: customerId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid input }
        '401': { description: Unauthorized }
    post:
      operationId: placeOrder
      summary: Place an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, items, channel]
              properties:
                customerId: { type: string }
                channel: { type: string, enum: [web, mobile, pos] }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, qty]
                    properties:
                      sku: { type: string, example: BAG-1 }
                      qty: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid input }
        '401': { description: Unauthorized }
        '404': { description: Customer not found }
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getOrder
      summary: Get one order
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { description: Unauthorized }
        '404': { description: Not found }
    delete:
      operationId: cancelOrder
      summary: Cancel an order
      responses:
        '204': { description: Cancelled }
        '401': { description: Unauthorized }
        '404': { description: Not found }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Customer:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
    Order:
      type: object
      required: [id, customerId, status, total, channel, items]
      properties:
        id: { type: string }
        customerId: { type: string }
        status: { type: string, enum: [pending, paid, cancelled] }
        total: { type: number }
        channel: { type: string }
        items:
          type: array
          items:
            type: object
            required: [sku, qty, price]
            properties:
              sku: { type: string }
              qty: { type: integer }
              price: { type: number }
